<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d">
  <title id="t">Ready Suite quest map</title>
  <desc id="d">Four tiers. Orchestration: kickoff-ready. Planning: prd-ready, architecture-ready, roadmap-ready, stack-ready. Building: repo-ready, production-ready. Shipping: deploy-ready, observe-ready, launch-ready, harden-ready.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="779" rx="10" fill="#0E1418" stroke="#243038"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#152026"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#243038"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#3DB8A9" letter-spacing="1.5">QUEST MAP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#8AA0A8" text-anchor="end">ELEVEN SKILLS  FOUR TIERS</text>

  <!-- Orchestration -->
  <g transform="translate(28 72)">
    <rect width="276" height="660" rx="4" fill="#152026" stroke="#3DB8A9"/>
    <text x="18" y="32" class="mono" font-size="12" font-weight="700" fill="#3DB8A9" letter-spacing="1.5">01  ORCHESTRATION</text>
    <line x1="0" y1="48" x2="276" y2="48" stroke="#243038"/>
    <g transform="translate(16 72)">
      <rect width="244" height="140" rx="4" fill="#0E1418" stroke="#3DB8A9"/>
      <text x="16" y="36" class="mono" font-size="28" font-weight="700" fill="#3DB8A9">01</text>
      <rect x="164" y="16" width="64" height="22" rx="3" fill="#3DB8A9"/>
      <text x="196" y="31" class="mono" font-size="11" font-weight="700" fill="#0E1418" text-anchor="middle" letter-spacing="1">START</text>
      <text x="16" y="68" class="sans" font-size="18" font-weight="700" fill="#E8F2F4">kickoff-ready</text>
      <text x="16" y="94" class="sans" font-size="13" fill="#8AA0A8">Sequence the specialists</text>
      <text x="16" y="122" class="mono" font-size="12" fill="#E8F2F4">Reward: PROGRESS.md</text>
    </g>
    <text x="18" y="260" class="sans" font-size="13" fill="#8AA0A8">Clear with /kickoff-ready</text>
    <text x="18" y="286" class="sans" font-size="13" fill="#8AA0A8">when the project is greenfield</text>
    <text x="18" y="312" class="sans" font-size="13" fill="#8AA0A8">and you want the full arc.</text>
  </g>

  <!-- Planning -->
  <g transform="translate(320 72)">
    <rect width="276" height="660" rx="4" fill="#152026" stroke="#243038"/>
    <text x="18" y="32" class="mono" font-size="12" font-weight="700" fill="#3DB8A9" letter-spacing="1.5">02  PLANNING</text>
    <line x1="0" y1="48" x2="276" y2="48" stroke="#243038"/>
    <g class="sans" font-size="15" font-weight="700" fill="#E8F2F4">
      <text x="18" y="88">02  prd-ready</text>
      <text x="18" y="118" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">What and for whom</text>
      <text x="18" y="158">03  architecture-ready</text>
      <text x="18" y="188" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">How the pieces fit</text>
      <text x="18" y="228">04  roadmap-ready</text>
      <text x="18" y="258" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Sequence over time</text>
      <text x="18" y="298">05  stack-ready</text>
      <text x="18" y="328" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Pick the tools</text>
    </g>
    <line x1="18" y1="360" x2="258" y2="360" stroke="#243038"/>
    <text x="18" y="392" class="mono" font-size="12" fill="#8AA0A8">Rewards</text>
    <text x="18" y="420" class="mono" font-size="12" fill="#E8F2F4">PRD.md  ARCH.md</text>
    <text x="18" y="444" class="mono" font-size="12" fill="#E8F2F4">ROADMAP.md</text>
    <text x="18" y="468" class="mono" font-size="12" fill="#E8F2F4">DECISION.md</text>
  </g>

  <!-- Building -->
  <g transform="translate(612 72)">
    <rect width="276" height="660" rx="4" fill="#152026" stroke="#243038"/>
    <text x="18" y="32" class="mono" font-size="12" font-weight="700" fill="#3DB8A9" letter-spacing="1.5">03  BUILDING</text>
    <line x1="0" y1="48" x2="276" y2="48" stroke="#243038"/>
    <g class="sans" font-size="15" font-weight="700" fill="#E8F2F4">
      <text x="18" y="88">06  repo-ready</text>
      <text x="18" y="118" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Production-grade hygiene</text>
      <text x="18" y="158">07  production-ready</text>
      <text x="18" y="188" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Build the app itself</text>
    </g>
    <line x1="18" y1="220" x2="258" y2="220" stroke="#243038"/>
    <text x="18" y="252" class="mono" font-size="12" fill="#8AA0A8">Rewards</text>
    <text x="18" y="280" class="mono" font-size="12" fill="#E8F2F4">repo scaffold</text>
    <text x="18" y="304" class="mono" font-size="12" fill="#E8F2F4">working product slices</text>
  </g>

  <!-- Shipping -->
  <g transform="translate(904 72)">
    <rect width="268" height="660" rx="4" fill="#152026" stroke="#243038"/>
    <text x="18" y="32" class="mono" font-size="12" font-weight="700" fill="#3DB8A9" letter-spacing="1.5">04  SHIPPING</text>
    <line x1="0" y1="48" x2="268" y2="48" stroke="#243038"/>
    <g class="sans" font-size="15" font-weight="700" fill="#E8F2F4">
      <text x="18" y="88">08  deploy-ready</text>
      <text x="18" y="118" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Real environments</text>
      <text x="18" y="158">09  observe-ready</text>
      <text x="18" y="188" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Keep it healthy</text>
      <text x="18" y="228">10  launch-ready</text>
      <text x="18" y="258" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Tell the world</text>
      <text x="18" y="298">11  harden-ready</text>
      <text x="18" y="328" class="sans" font-size="12" font-weight="400" fill="#8AA0A8">Survive scrutiny</text>
    </g>
    <line x1="18" y1="360" x2="250" y2="360" stroke="#243038"/>
    <text x="18" y="392" class="mono" font-size="12" fill="#8AA0A8">Rewards</text>
    <text x="18" y="420" class="mono" font-size="12" fill="#E8F2F4">DEPLOY.md</text>
    <text x="18" y="444" class="mono" font-size="12" fill="#E8F2F4">OBS.md  LAUNCH.md</text>
    <text x="18" y="468" class="mono" font-size="12" fill="#E8F2F4">HARDEN.md</text>
  </g>
</svg>
