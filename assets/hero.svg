<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Ready Suite 3.1.0</title>
  <desc id="d">Ready Suite wordmark with the line: eleven skills, one arc from idea to launch. A status board lists 11 skills, 4 tiers, artifact contracts, and 6 plus installer targets.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#0E1418" stroke="#243038"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#152026"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#243038"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#3DB8A9" letter-spacing="1.5">READY SUITE 3.1.0</text>
  <text x="600" y="28" class="mono" font-size="13" fill="#8AA0A8" text-anchor="middle">@hxp-tools/ready-suite</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#8AA0A8" text-anchor="end">PRESS START  /kickoff-ready</text>

  <text x="52" y="168" class="sans" font-size="92" font-weight="800" fill="#E8F2F4" letter-spacing="-3">Ready Suite</text>
  <rect x="52" y="188" width="56" height="6" fill="#3DB8A9"/>
  <text x="52" y="238" class="sans" font-size="28" font-weight="600" fill="#E8F2F4">Eleven skills. Four tiers.</text>
  <text x="52" y="276" class="sans" font-size="28" font-weight="600" fill="#E8F2F4">One arc from idea to launch.</text>
  <text x="52" y="318" class="sans" font-size="17" fill="#8AA0A8">Orchestrate, plan, build, ship. Artifacts are the contract between skills.</text>

  <g transform="translate(776 76)">
    <rect width="392" height="270" rx="4" fill="#152026" stroke="#243038"/>
    <text x="20" y="31" class="mono" font-size="12" font-weight="700" fill="#8AA0A8" letter-spacing="2">STATUS BOARD</text>
    <line x1="0" y1="46" x2="392" y2="46" stroke="#243038"/>
    <g class="sans" font-size="17" fill="#E8F2F4">
      <text x="20" y="80">Skills</text>
      <text x="20" y="124">Tiers</text>
      <text x="20" y="168">Contract</text>
      <text x="20" y="212">Composition</text>
      <text x="20" y="256">Installer targets</text>
    </g>
    <g class="mono" font-size="22" font-weight="700" fill="#3DB8A9" text-anchor="end">
      <text x="372" y="80">11</text>
      <text x="372" y="124">4</text>
      <text x="372" y="168">ARTIFACTS</text>
      <text x="372" y="212">NO CALLS</text>
      <text x="372" y="256">6+</text>
    </g>
    <g stroke="#243038">
      <line x1="0" y1="90" x2="392" y2="90"/><line x1="0" y1="134" x2="392" y2="134"/>
      <line x1="0" y1="178" x2="392" y2="178"/><line x1="0" y1="222" x2="392" y2="222"/>
    </g>
  </g>
</svg>
